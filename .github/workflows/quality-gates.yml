# Quality Gates — islamwiki/web
# Sprint B9 DR-B9-PERF-01 + DR-B9-A11Y-01 | Ticket TB9-17
# Enforces Lighthouse performance budgets and axe WCAG 2.1 AA on every PR and push to main.

name: Quality Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse CI
    uses: ./.github/workflows/_reusable-lighthouse.yml
    with:
      project_path: web

  axe:
    name: axe WCAG 2.1 AA
    uses: ./.github/workflows/_reusable-axe.yml
    with:
      project_path: web

  bundle-size:
    name: Bundle size check (web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Build with bundle analyzer (T12)
        run: ANALYZE=true pnpm build
        env:
          ANALYZE: 'true'
