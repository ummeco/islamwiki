# Quality Gates — islamwiki/web
# Sprint B9 DR-B9-PERF-01 + DR-B9-A11Y-01 | Ticket TB9-17
# Enforces Lighthouse performance budgets and axe WCAG 2.1 AA on every PR and push to main.

name: Quality Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse CI
    # TODO(P2-E5): wire CI services — lhci needs a running Next.js server + Chromium sandbox.
    # CHROME_INTERSTITIAL_ERROR fires because the server is not ready before lhci connects.
    # Port corrected to 3041 (matches pnpm start in package.json).
    # Re-enable as hard failure (remove continue-on-error) once CI services are wired.
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Build
        working-directory: web
        run: pnpm build
      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.13.x
      - name: Run Lighthouse CI
        working-directory: web
        run: lhci autorun
      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-web
          path: web/.lighthouseci
          retention-days: 30

  axe:
    name: axe WCAG 2.1 AA
    # TODO(P2-E5): wire CI services — axe wait-on times out because pnpm start requires env vars
    # (NEXTAUTH_SECRET etc.) that are not available without CI services.
    # Re-enable as hard failure (remove continue-on-error) once CI services are wired.
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Build
        working-directory: web
        run: pnpm build
      - name: Start dev server
        working-directory: web
        run: pnpm start &
      - name: Wait for server
        run: npx wait-on http://localhost:3041 -t 60000
      # @axe-core/cli bundles a `chromedriver` pinned to the latest Chrome stable,
      # which drifts out of sync with the runner's installed Chrome. When they
      # disagree the session comes up broken and axe fails with
      # "Cannot read properties of undefined (reading 'runPartial')" - axe-core
      # never finishes injecting. `which chromedriver` finds the bundled
      # mismatched binary, so pointing at it does not help.
      # nanasess/setup-chromedriver drops the driver matching THIS runner's
      # Chrome at /usr/local/bin/chromedriver. Same fix chatislam/praycalc use.
      - name: Setup matching ChromeDriver
        uses: nanasess/setup-chromedriver@v3
      - name: Install axe-core CLI
        run: npm install -g @axe-core/cli
        # Make the bundled chromedriver npm package reuse the matched binary
        # rather than downloading its own (dequelabs/axe-core-npm#370).
        env:
          CHROMEDRIVER_FILEPATH: /usr/local/bin/chromedriver
      - name: Run axe — root route
        working-directory: web
        run: |
          axe \
            http://localhost:3041 \
            --exit \
            --tags wcag2a,wcag2aa,wcag21a,wcag21aa \
            --chromedriver-path /usr/local/bin/chromedriver \
            --chrome-options="no-sandbox,disable-setuid-sandbox,disable-dev-shm-usage"

  bundle-size:
    name: Bundle size check (web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          cache-dependency-path: 'web/pnpm-lock.yaml'
      - run: pnpm install --frozen-lockfile
      - name: Build with bundle analyzer (T12)
        run: ANALYZE=true pnpm build
        env:
          ANALYZE: 'true'
