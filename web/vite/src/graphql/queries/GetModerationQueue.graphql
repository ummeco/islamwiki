# GetModerationQueue.graphql
# PURPOSE: Fetch articles pending moderation review.
# REF: p2-islamwiki-astro-vite-spec.md §7.3

query GetModerationQueue {
  iw_articles(
    where: { status: { _eq: "pending_review" } }
    order_by: { created_at: asc }
  ) {
    id
    slug
    title
    status
    language
    created_at
    category {
      id
      slug
      name
    }
    revisions: iw_article_revisions(order_by: { created_at: desc }, limit: 1) {
      id
      content_md
      content_html
      created_at
      author {
        id
        display_name
      }
      theology_checks(order_by: { created_at: desc }, limit: 1) {
        id
        status
        flags
        completed_at
      }
    }
  }
}
